<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เครื่องมือนับตัวอักษรและจัดการข้อความ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght=300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
        }
        /* ป้องกันการเลื่อนหน้าจอระบบหลัก */
        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col justify-between p-3 selection:bg-emerald-500 selection:text-slate-950">

    <!-- ส่วนหัวหน้าเว็บ (Header) ขนาดมินิมอลสุดๆ -->
    <header class="flex flex-row justify-between items-center pb-2 border-b border-slate-900/80">
        <div class="flex items-center gap-1.5">
            <span class="text-base">✍️</span>
            <div>
                <h1 class="text-xs font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-300">
                    เครื่องมือนับตัวอักษรและจัดการข้อความ
                </h1>
                <p class="text-[9px] text-slate-500">นับอักษรและจัดการข้อความด่วน</p>
            </div>
        </div>
        <span class="text-[8px] bg-slate-900 text-slate-400 px-1.5 py-0.5 rounded border border-slate-800 font-medium">
            v1.3
        </span>
    </header>

    <!-- ส่วนเนื้อหาหลัก จัดวางให้พอดีหน้าจอโดยใช้ Flexbox -->
    <main class="flex-grow flex flex-col gap-2.5 my-2 min-h-0">
        
        <!-- แผงแสดงสถิติการตรวจนับ (ย่อขนาดและกระชับพื้นที่) -->
        <section class="grid grid-cols-2 gap-2">
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-900 flex flex-col justify-center">
                <span class="text-[10px] text-slate-400 font-bold">รวมสเปซ</span>
                <div class="flex items-baseline gap-1">
                    <span id="charCount" class="text-lg font-black text-emerald-400">0</span>
                    <span class="text-[9px] text-slate-500">ตัว</span>
                </div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-900 flex flex-col justify-center">
                <span class="text-[10px] text-slate-400 font-bold">ไม่รวมสเปซ</span>
                <div class="flex items-baseline gap-1">
                    <span id="charNoSpaceCount" class="text-lg font-black text-emerald-400">0</span>
                    <span class="text-[9px] text-slate-500">ตัว</span>
                </div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-900 flex flex-col justify-center">
                <span class="text-[10px] text-slate-400 font-bold">จำนวนคำ</span>
                <div class="flex items-baseline gap-1">
                    <span id="wordCount" class="text-lg font-black text-emerald-400">0</span>
                    <span class="text-[9px] text-slate-500">คำ</span>
                </div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-900 flex flex-col justify-center">
                <span class="text-[10px] text-slate-400 font-bold">จำนวนบรรทัด</span>
                <div class="flex items-baseline gap-1">
                    <span id="lineCount" class="text-lg font-black text-emerald-400">0</span>
                    <span class="text-[9px] text-slate-500">แถว</span>
                </div>
            </div>
        </section>

        <!-- พื้นที่ป้อนข้อความ (ยืดหยุ่นตามพื้นที่ว่างที่เหลือ) -->
        <section class="flex-grow flex flex-col gap-1 min-h-0">
            <div class="flex justify-between items-center px-1">
                <label for="editor" class="text-[10px] font-bold text-slate-400 flex items-center gap-1">
                    <span class="inline-block w-1 h-1 rounded-full bg-emerald-500 animate-pulse"></span>
                    กรอกหรือวางข้อความของตะเองที่นี่เลยจ้า
                </label>
                <span id="saveStatus" class="text-[9px] text-slate-500 transition-opacity duration-300 opacity-0">เซฟชั่วคราวแล้ว</span>
            </div>
            <div class="relative flex-grow min-h-0">
                <textarea 
                    id="editor" 
                    class="w-full h-full bg-slate-900 border border-slate-850 focus:border-emerald-500 rounded-xl p-3 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:ring-0 transition-colors resize-none leading-relaxed text-sm"
                    placeholder="พิมพ์หรือวางข้อความตรงนี้..."
                ></textarea>
                <!-- ปุ่มเคลียร์ข้อความแบบเล็กกะทัดรัด -->
                <button 
                    onclick="clearText()" 
                    class="absolute bottom-2 right-2 bg-red-950/80 hover:bg-red-900 text-red-200 px-2 py-1 rounded-lg text-[9px] font-bold border border-red-800/40 transition-colors flex items-center gap-1 backdrop-blur"
                >
                    🗑️ ล้างทั้งหมด
                </button>
            </div>
        </section>

        <!-- แผงเครื่องมือควบคุมการทำงาน (ตัดคำอธิบายออก เหลือเพียงปุ่มกดขนาดพอดีมือ) -->
        <section class="bg-slate-900/40 border border-slate-900 rounded-xl p-2.5 flex flex-col gap-2">
            
            <div class="grid grid-cols-3 gap-1.5">
                
                <!-- เครื่องมือลบสัญลักษณ์พิเศษ -->
                <button 
                    onclick="removeSymbols()" 
                    class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95"
                >
                    <span class="text-sm">✨</span>
                    <span class="text-[10px] font-bold">ลบสัญลักษณ์</span>
                </button>

                <!-- เครื่องมือลบตัวเลข -->
                <button 
                    onclick="removeNumbers()" 
                    class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95"
                >
                    <span class="text-sm">🚫</span>
                    <span class="text-[10px] font-bold">ลบตัวเลข</span>
                </button>

                <!-- เครื่องมือทดลองลบสระ/วรรณยุกต์ -->
                <button 
                    onclick="removeVowels()" 
                    class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95"
                >
                    <span class="text-sm">🧪</span>
                    <span class="text-[10px] font-bold">ลบสระ/วรรณ</span>
                </button>

                <!-- เครื่องมือจัดระเบียบช่องว่าง -->
                <button 
                    onclick="squeezeSpaces()" 
                    class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95"
                >
                    <span class="text-sm">↔️</span>
                    <span class="text-[10px] font-bold">จัดช่องว่าง</span>
                </button>

                <!-- เครื่องมือแปลงเป็นตัวพิมพ์ใหญ่ -->
                <button 
                    onclick="convertUpper()" 
                    class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95"
                >
                    <span class="text-sm">🅰️</span>
                    <span class="text-[10px] font-bold">พิมพ์ใหญ่</span>
                </button>

                <!-- เครื่องมือแปลงเป็นตัวพิมพ์เล็ก -->
                <button 
                    onclick="convertLower()" 
                    class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95"
                >
                    <span class="text-sm">ⓐ</span>
                    <span class="text-[10px] font-bold">พิมพ์เล็ก</span>
                </button>

            </div>

            <!-- ส่วนควบคุมหลักด้านล่าง -->
            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-900/60">
                <!-- เครื่องมือสลับคำแบบสุ่ม -->
                <button 
                    onclick="shuffleWords()" 
                    class="bg-amber-950/20 hover:bg-amber-950/40 text-amber-200 py-2.5 px-2 rounded-lg border border-amber-900/30 text-[10px] font-bold transition-all flex items-center justify-center gap-1 active:scale-95"
                >
                    🌪️ สุ่มสลับคำ
                </button>

                <!-- ปุ่มคัดลอกข้อความ -->
                <button 
                    onclick="copyToClipboard()" 
                    class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-2.5 px-2 rounded-lg text-[10px] font-black transition-all flex items-center justify-center gap-1.5 shadow-lg shadow-emerald-500/5 active:scale-95"
                >
                    📋 ก๊อปปี้ไปใช้โลด
                </button>
            </div>
        </section>

        <!-- กล่องแจ้งเตือนการคัดลอก (Toast Notification) -->
        <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 border-2 border-emerald-500 text-emerald-400 px-4 py-2 rounded-full shadow-2xl shadow-emerald-500/10 flex items-center gap-1.5 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 z-50">
            <span class="text-sm">🎉</span>
            <span id="toastMessage" class="text-[10px] font-bold">คัดลอกเรียบร้อยแล้วจ้า</span>
        </div>

    </main>

    <!-- ส่วนท้ายเว็บแสดงลิขสิทธิ์ของพี่มุ่ยสุดหล่ออย่างเป็นทางการ -->
    <footer class="border-t border-slate-900 py-1.5 text-center text-[8px] text-slate-600 flex flex-col gap-0.5">
        <p class="font-bold text-slate-500">
            สงวนลิขสิทธิ์ตาม พรบ.ลิขสิทธิ์ © 2026 โดย 
            <span class="text-emerald-400 font-extrabold hover:text-teal-300 transition-colors">พี่มุ่ยสุดหล่อ</span> 
            ผู้พัฒนาที่หน้าตาดีที่สุดในจักรวาล
        </p>
    </footer>

    <!-- ส่วนเขียนฟังก์ชัน JavaScript -->
    <script>
        const editor = document.getElementById('editor');
        const charCount = document.getElementById('charCount');
        const charNoSpaceCount = document.getElementById('charNoSpaceCount');
        const wordCount = document.getElementById('wordCount');
        const lineCount = document.getElementById('lineCount');
        const saveStatus = document.getElementById('saveStatus');

        // ฟังก์ชันคำนวณสถิติของข้อความ
        function updateMetrics() {
            const text = editor.value;

            // 1. คำนวณตัวอักษรรวมช่องว่าง
            charCount.textContent = text.length;

            // 2. คำนวณตัวอักษรไม่รวมช่องว่าง
            const textNoSpace = text.replace(/\s/g, '');
            charNoSpaceCount.textContent = textNoSpace.length;

            // 3. คำนวณจำนวนคำ
            const trimmedText = text.trim();
            if (trimmedText === '') {
                wordCount.textContent = 0;
            } else {
                const words = trimmedText.split(/\s+/);
                wordCount.textContent = words.length;
            }

            // 4. คำนวณจำนวนบรรทัด
            if (text === '') {
                lineCount.textContent = 0;
            } else {
                const lines = text.split('\n');
                lineCount.textContent = lines.length;
            }

            // บันทึกข้อความลงอุปกรณ์ของผู้ใช้เพื่อป้องกันข้อมูลหายเมื่อรีเฟรชหน้าเว็บ
            localStorage.setItem('github_char_counter_saved_text', text);
            showSaveIndicator();
        }

        // โหลดข้อมูลล่าสุดที่เคยป้อนค้างไว้เมื่อเข้าเว็บอีกครั้ง
        window.onload = function() {
            const savedText = localStorage.getItem('github_char_counter_saved_text');
            if (savedText) {
                editor.value = savedText;
                updateMetrics();
            }
        };

        // ผูกอีเวนต์เมื่อมีการแก้ไขข้อความ
        editor.addEventListener('input', updateMetrics);

        // ตัวแสดงผลการบันทึกข้อมูลแบบเรียลไทม์
        let saveTimeout;
        function showSaveIndicator() {
            saveStatus.classList.remove('opacity-0');
            saveStatus.classList.add('opacity-100');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveStatus.classList.remove('opacity-100');
                saveStatus.classList.add('opacity-0');
            }, 1000);
        }

        // 1. ฟังก์ชันลบสัญลักษณ์พิเศษ
        function removeSymbols() {
            const originalText = editor.value;
            // กรองเก็บไว้เพียงอักษรภาษาไทย อังกฤษ ตัวเลขอารบิกและตัวเลขไทย รวมถึงช่องว่าง
            const cleanedText = originalText.replace(/[^\u0E01-\u0E5B a-zA-Z0-9\s]/g, '');
            editor.value = cleanedText;
            updateMetrics();
            showToast('ลบสัญลักษณ์พิเศษเรียบร้อยแล้วจ้า');
        }

        // 2. ฟังก์ชันลบตัวเลขทั้งหมด
        function removeNumbers() {
            const originalText = editor.value;
            const cleanedText = originalText.replace(/[0-9๐-๙]/g, '');
            editor.value = cleanedText;
            updateMetrics();
            showToast('ลบตัวเลขทั้งหมดเรียบร้อยแล้วจ้า');
        }

        // 3. ฟังก์ชันลบสระและวรรณยุกต์
        function removeVowels() {
            const originalText = editor.value;
            // ช่วงรหัสภาษาไทยที่เป็นสระ วรรณยุกต์ และตัวการันต์
            const cleanedText = originalText.replace(/[\u0E30-\u0E3F\u0E47-\u0E4E]/g, '');
            editor.value = cleanedText;
            updateMetrics();
            showToast('ลบสระและวรรณยุกต์เรียบร้อยแล้วจ้า');
        }

        // 4. ฟังก์ชันจัดระเบียบช่องว่าง
        function squeezeSpaces() {
            const originalText = editor.value;
            const cleanedText = originalText.replace(/[^\S\r\n]+/g, ' ').trim();
            editor.value = cleanedText;
            updateMetrics();
            showToast('จัดระเบียบช่องว่างเรียบร้อยแล้วจ้า');
        }

        // 5. แปลงเป็นตัวพิมพ์ใหญ่
        function convertUpper() {
            editor.value = editor.value.toUpperCase();
            updateMetrics();
            showToast('แปลงเป็นพิมพ์ใหญ่เรียบร้อยแล้วจ้า');
        }

        // 6. แปลงเป็นตัวพิมพ์เล็ก
        function convertLower() {
            editor.value = editor.value.toLowerCase();
            updateMetrics();
            showToast('แปลงเป็นพิมพ์เล็กเรียบร้อยแล้วจ้า');
        }

        // 7. สลับตำแหน่งคำแบบสุ่ม
        function shuffleWords() {
            const text = editor.value.trim();
            if (!text) {
                showToast('กรุณากรอกข้อความก่อนนะคะ');
                return;
            }
            let words = text.split(/\s+/);
            for (let i = words.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [words[i], words[j]] = [words[j], words[i]];
            }
            editor.value = words.join(' ');
            updateMetrics();
            showToast('สุ่มสลับคำเรียบร้อยแล้วจ้า');
        }

        // 8. ฟังก์ชันเคลียร์หน้าจอ
        function clearText() {
            editor.value = '';
            updateMetrics();
            showToast('ล้างข้อความเรียบร้อยแล้วจ้า');
            editor.focus();
        }

        // ฟังก์ชันคัดลอกข้อความ
        function copyToClipboard() {
            const text = editor.value;
            if (!text) {
                showToast('ช่องกรอกข้อความว่างเปล่าจ้า');
                return;
            }

            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = text;
            tempTextArea.style.position = 'fixed';
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            tempTextArea.setSelectionRange(0, 99999);

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('คัดลอกลงคลิปบอร์ดเรียบร้อยแล้วจ้า');
                } else {
                    showToast('เบราว์เซอร์ไม่รองรับการก๊อปปี้จ้า');
                }
            } catch (err) {
                showToast('เกิดข้อผิดพลาดในการคัดลอกจ้า');
            }

            document.body.removeChild(tempTextArea);
        }

        // ฟังก์ชันควบคุมแจ้งเตือนด้านล่าง (Toast)
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            
            toast.classList.remove('opacity-0', 'translate-y-20', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-20', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
