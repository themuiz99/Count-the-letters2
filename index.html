<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>TheMuiZ เครื่องมือจัดการตัวอักษร</title>

    <link href="https://fonts.googleapis.com/css2?family=Pattaya&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>

        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-input: #2a2a2a;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent: #bb86fc;
            --accent-hover: #9965f4;
            --btn-bg: #333333;
            --btn-hover: #444444;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 8px;
        }

        .header {
            text-align: center;
            margin-bottom: 5px;
            flex-shrink: 0;
        }

        .site-title {
            font-family: 'Pattaya', sans-serif;
            font-size: 24px;
            background: linear-gradient(45deg, var(--accent), #ff79c6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0;
            line-height: 1.1;
        }

        .site-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .workspace {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            gap: 8px;
        }

        @media (min-width: 768px) {
            .workspace {
                flex-direction: row;
            }
        }

        .text-section {
            display: flex;
            flex-direction: column;
            flex: 2;
            gap: 8px;
            min-height: 0;
        }

        .box-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            background: var(--bg-card);
            border-radius: 8px;
            padding: 8px;
            border: 1px solid var(--border);
            position: relative;
            min-height: 0;
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 13px;
            flex-shrink: 0;
        }

        .btn-group-small {
            display: flex;
            gap: 4px;
        }

        .btn-group-small button {
            background: var(--btn-bg);
            color: var(--text-main);
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-undo {
            background: #f57c00 !important;
            color: #fff !important;
            border: 1px solid #e65100 !important;
        }

        .btn-danger {
            background: #d32f2f !important;
            color: #fff !important;
            border: 1px solid #b71c1c !important;
        }

        .btn-success {
            background: #2e7d32 !important;
            color: #fff !important;
            border: 1px solid #1b5e20 !important;
        }

        .textarea-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            min-height: 0;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            font-size: 14px;
            resize: none;
            outline: none;
            overflow-y: auto;
        }

        .char-count {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 10px;
            color: var(--text-muted);
            background: rgba(42, 42, 42, 0.8);
            padding: 1px 4px;
            border-radius: 4px;
        }

        .custom-remove-sec {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex-shrink: 0;
            font-size: 13px;
        }

        .custom-remove-sec input {
            flex: 1;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            outline: none;
        }

        .tools-section {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 6px;
            border: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .tools-title {
            font-size: 12px;
            color: var(--accent);
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .tool-btn {
            color: #fff;
            border: 1px solid transparent;
            padding: 4px 2px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-c1 { background: #b71c1c; }
        .btn-c2 { background: #c62828; }
        .btn-c3 { background: #d84315; }
        .btn-c4 { background: #ef6c00; }

        .btn-c5 { background: #f9a825; }
        .btn-c6 { background: #9e9d24; }
        .btn-c7 { background: #558b2f; }
        .btn-c8 { background: #00695c; }

        .btn-c9 { background: #00838f; }
        .btn-c10 { background: #0277bd; }
        .btn-c11 { background: #1565c0; }
        .btn-c12 { background: #283593; }

        .btn-c13 { background: #4527a0; }
        .btn-c14 { background: #6a1b9a; }
        .btn-c15 { background: #ad1457; }
        .btn-c16 { background: #4e342e; }

        .btn-c17 { background: #bf360c; }
        .btn-c18 { background: #7b1fa2; }
        .btn-c19 { background: #004d40; }

        .footer {
            text-align: center;
            margin-top: 2px;
            font-size: 9px;
            color: var(--text-muted);
        }

        #toast {
            visibility: hidden;
            min-width: 180px;
            background-color: #4caf50;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 8px;
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
            z-index: 9999;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
        }

        /* ============================= */
        /* ระบบบันทึกไฟล์ */
        /* ============================= */

        .save-document-section {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .save-document-section select {
            background: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 5px;
            font-size: 11px;
            cursor: pointer;
            outline: none;
        }

        .btn-save-document {
            background: #1565c0 !important;
            color: #fff !important;
            border: 1px solid #0d47a1 !important;
            padding: 3px 7px !important;
            border-radius: 4px !important;
            font-size: 11px !important;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-save-document:hover {
            background: #1976d2 !important;
        }

    </style>

</head>

<body>

    <div class="header">
        <h1 class="site-title">TheMuiZ</h1>
        <div class="site-subtitle">เครื่องมือจัดการตัวอักษร</div>
    </div>


    <div class="workspace">


        <div class="text-section">


            <div class="box-container">

                <div class="box-header">

                    <span>ช่องกรอกข้อมูล</span>

                    <div class="btn-group-small">

                        <button
                            onclick="undo()"
                            class="btn-undo">
                            ย้อนกลับ
                        </button>

                        <button
                            onclick="clearText()"
                            class="btn-danger">
                            ล้างข้อความ
                        </button>

                    </div>

                </div>


                <div class="textarea-wrapper">

                    <textarea id="input-text"></textarea>

                    <div
                        id="input-count"
                        class="char-count">
                        0 อักษร
                    </div>

                </div>

            </div>


            <div class="custom-remove-sec">

                <span>ลบเฉพาะตัว:</span>

                <input
                    type="text"
                    id="custom-remove-input"
                    placeholder="a,b,ก (คั่นด้วย ,)">

            </div>


            <div class="box-container">

                <div class="box-header">

                    <span>ช่องแสดงผลลัพธ์</span>


                    <div class="save-document-section">


                        <button
                            onclick="copyOutput()"
                            class="btn-success">
                            คัดลอกข้อความ
                        </button>


                        <select
                            id="document-format"
                            title="เลือกรูปแบบไฟล์">

                            <option value="txt">TXT</option>
                            <option value="md">MD</option>
                            <option value="csv">CSV</option>
                            <option value="html">HTML</option>
                            <option value="json">JSON</option>
                            <option value="xml">XML</option>
                            <option value="pdf">PDF</option>

                        </select>


                        <button
                            onclick="saveDocument()"
                            class="btn-save-document">
                            บันทึกไฟล์
                        </button>


                    </div>

                </div>


                <div class="textarea-wrapper">

                    <textarea
                        id="output-text"
                        readonly></textarea>

                    <div
                        id="output-count"
                        class="char-count">
                        0 อักษร
                    </div>

                </div>

            </div>


        </div>


        <div class="tools-section">


            <div class="tools-title">
                เครื่องมือจัดการ
            </div>


            <div class="tools-grid">


                <button
                    class="tool-btn btn-c1"
                    onclick="applyTool('removeAllSymbols')">
                    ลบสัญลักษณ์ทั้งหมด
                </button>


                <button
                    class="tool-btn btn-c2"
                    onclick="applyTool('removeSymbolsKeepBasic')">
                    ลบสัญลักษณ์พื้นฐาน
                </button>


                <button
                    class="tool-btn btn-c3"
                    onclick="applyTool('removeNumbers')">
                    ลบตัวเลขทั้งหมด
                </button>


                <button
                    class="tool-btn btn-c18"
                    onclick="applyTool('removeEnglish')">
                    ลบภาษาอังกฤษ
                </button>


                <button
                    class="tool-btn btn-c4"
                    onclick="applyTool('toThaiNumbers')">
                    เปลี่ยนเป็นเลขไทย
                </button>


                <button
                    class="tool-btn btn-c5"
                    onclick="applyTool('toArabicNumbers')">
                    เปลี่ยนเป็นอารบิก
                </button>


                <button
                    class="tool-btn btn-c6"
                    onclick="applyTool('upperCaseEng')">
                    EN พิมพ์ใหญ่
                </button>


                <button
                    class="tool-btn btn-c7"
                    onclick="applyTool('lowerCaseEng')">
                    EN พิมพ์เล็ก
                </button>


                <button
                    class="tool-btn btn-c8"
                    onclick="applyTool('capitalizeEng')"
                    style="grid-column: span 2;">
                    EN ขึ้นต้นพิมพ์ใหญ่
                </button>


                <button
                    class="tool-btn btn-c9"
                    onclick="applyTool('removeSpaces')">
                    ลบเว้นวรรค
                </button>


                <button
                    class="tool-btn btn-c10"
                    onclick="applyTool('removeNewlines')">
                    ลบขึ้นบรรทัดใหม่
                </button>


                <button
                    class="tool-btn btn-c11"
                    onclick="applyTool('removeDuplicateSpaces')">
                    ลบเว้นวรรคซ้ำ
                </button>


                <button
                    class="tool-btn btn-c12"
                    onclick="applyTool('removeDuplicateLines')">
                    ลบบรรทัดซ้ำ
                </button>


                <button
                    class="tool-btn btn-c13"
                    onclick="applyTool('extractNumbers')">
                    ดึงเฉพาะตัวเลข
                </button>


                <button
                    class="tool-btn btn-c14"
                    onclick="applyTool('extractThai')">
                    ดึงเฉพาะภาษาไทย
                </button>


                <button
                    class="tool-btn btn-c15"
                    onclick="applyTool('extractEnglish')">
                    ดึงเฉพาะภาษาอังกฤษ
                </button>


                <button
                    class="tool-btn btn-c16"
                    onclick="applyTool('reverseText')">
                    กลับหลังหันข้อความ
                </button>


                <button
                    class="tool-btn btn-c17"
                    onclick="applyTool('removeLinks')">
                    ลบลิงก์ (URL)
                </button>


                <button
                    class="tool-btn btn-c19"
                    onclick="applyTool('removeAIReferences')">
                    ลบแหล่งอ้างอิง AI
                </button>


            </div>

        </div>

    </div>


    <div class="footer">
        &copy; สงวนลิขสิทธิ์โดย TheMuiz
    </div>


    <div id="toast">
        คัดลอกข้อความสำเร็จ!
    </div>


<script>

    /* ========================================================= */
    /* DOM */
    /* ========================================================= */

    const inputArea =
        document.getElementById('input-text');

    const outputArea =
        document.getElementById('output-text');

    const customRemoveInput =
        document.getElementById('custom-remove-input');

    const inputCount =
        document.getElementById('input-count');

    const outputCount =
        document.getElementById('output-count');

    const toast =
        document.getElementById('toast');


    /* ========================================================= */
    /* History */
    /* ========================================================= */

    let outputHistory = [""];


    function saveState(text) {

        if (
            outputHistory[outputHistory.length - 1] !== text
        ) {
            outputHistory.push(text);
        }

    }


    function undo() {

        if (outputHistory.length > 1) {

            outputHistory.pop();

            const previousState =
                outputHistory[outputHistory.length - 1];

            outputArea.value = previousState;

            outputCount.innerText =
                `${outputArea.value.length} อักษร`;

        }

    }


    function clearText() {

        outputHistory = [""];

        inputArea.value = "";
        outputArea.value = "";

        inputCount.innerText = "0 อักษร";
        outputCount.innerText = "0 อักษร";

    }


    /* ========================================================= */
    /* Copy */
    /* ========================================================= */

    async function copyOutput() {

        const text =
            outputArea.value;

        try {

            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {

                await navigator.clipboard.writeText(text);

            } else {

                const t =
                    document.createElement('textarea');

                t.value = text;

                document.body.appendChild(t);

                t.select();

                document.execCommand('copy');

                document.body.removeChild(t);

            }

            toast.innerText =
                "คัดลอกข้อความสำเร็จ!";

            toast.className = "show";

            setTimeout(
                () => toast.className = "",
                2000
            );

        } catch (error) {

            alert(
                "ไม่สามารถคัดลอกข้อความได้"
            );

        }

    }


    /* ========================================================= */
    /* Process */
    /* ========================================================= */

    function processOutput() {

        let text =
            inputArea.value;

        const removeStr =
            customRemoveInput.value;


        if (removeStr) {

            const chars =
                removeStr
                    .split(',')
                    .map(c =>
                        c.trim()
                            .replace(
                                /[.*+?^${}()|[\]\\]/g,
                                '\\$&'
                            )
                    )
                    .filter(Boolean);


            if (chars.length > 0) {

                text =
                    text.replace(
                        new RegExp(
                            `(${chars.join('|')})`,
                            'g'
                        ),
                        ''
                    );

            }

        }


        outputArea.value =
            text;


        inputCount.innerText =
            `${inputArea.value.length} อักษร`;


        outputCount.innerText =
            `${outputArea.value.length} อักษร`;


        saveState(text);

    }


    inputArea.addEventListener(
        'input',
        processOutput
    );


    customRemoveInput.addEventListener(
        'input',
        processOutput
    );


    /* ========================================================= */
    /* Tools */
    /* ========================================================= */

    function applyTool(action) {

        let text =
            inputArea.value;

        const removeStr =
            customRemoveInput.value;


        if (removeStr) {

            const chars =
                removeStr
                    .split(',')
                    .map(c =>
                        c.trim()
                            .replace(
                                /[.*+?^${}()|[\]\\]/g,
                                '\\$&'
                            )
                    )
                    .filter(Boolean);


            if (chars.length > 0) {

                text =
                    text.replace(
                        new RegExp(
                            `(${chars.join('|')})`,
                            'g'
                        ),
                        ''
                    );

            }

        }


        switch(action) {


            case 'removeAllSymbols':

                text =
                    text.replace(
                        /[^\p{L}\p{M}\p{N}\s]/gu,
                        ''
                    );

                break;


            case 'removeSymbolsKeepBasic':

                text =
                    text.replace(
                        /[^\p{L}\p{M}\p{N}\s.,!?"'\-()]/gu,
                        ''
                    );

                break;


            case 'removeNumbers':

                text =
                    text.replace(
                        /[0-9๐-๙]/g,
                        ''
                    );

                break;


            case 'removeEnglish':

                text =
                    text.replace(
                        /[a-zA-Z]/g,
                        ''
                    );

                break;


            case 'toThaiNumbers':

                text =
                    text.replace(
                        /[0-9]/g,
                        m =>
                            ({
                                '0':'๐',
                                '1':'๑',
                                '2':'๒',
                                '3':'๓',
                                '4':'๔',
                                '5':'๕',
                                '6':'๖',
                                '7':'๗',
                                '8':'๘',
                                '9':'๙'
                            })[m]
                    );

                break;


            case 'toArabicNumbers':

                text =
                    text.replace(
                        /[๐-๙]/g,
                        m =>
                            ({
                                '๐':'0',
                                '๑':'1',
                                '๒':'2',
                                '๓':'3',
                                '๔':'4',
                                '๕':'5',
                                '๖':'6',
                                '๗':'7',
                                '๘':'8',
                                '๙':'9'
                            })[m]
                    );

                break;


            case 'upperCaseEng':

                text =
                    text.replace(
                        /[a-z]/g,
                        m => m.toUpperCase()
                    );

                break;


            case 'lowerCaseEng':

                text =
                    text.replace(
                        /[A-Z]/g,
                        m => m.toLowerCase()
                    );

                break;


            case 'capitalizeEng':

                text =
                    text.replace(
                        /\b[a-zA-Z]/g,
                        m => m.toUpperCase()
                    );

                break;


            case 'removeSpaces':

                text =
                    text.replace(
                        /[ \t]+/g,
                        ''
                    );

                break;


            case 'removeNewlines':

                text =
                    text.replace(
                        /[\r\n]+/g,
                        ''
                    );

                break;


            case 'removeDuplicateSpaces':

                text =
                    text.replace(
                        /[ \t]{2,}/g,
                        ' '
                    );

                break;


            case 'removeDuplicateLines':

                text =
                    text.replace(
                        /(\r?\n){2,}/g,
                        '\n'
                    );

                break;


            case 'extractNumbers':

                const n =
                    text.match(
                        /[0-9๐-๙]+/g
                    );

                text =
                    n ? n.join('\n') : '';

                break;


            case 'extractThai':

                const t =
                    text.match(
                        /[ก-๙]+/g
                    );

                text =
                    t ? t.join('\n') : '';

                break;


            case 'extractEnglish':

                const e =
                    text.match(
                        /[a-zA-Z]+/g
                    );

                text =
                    e ? e.join('\n') : '';

                break;


            case 'reverseText':

                text =
                    text
                        .split('')
                        .reverse()
                        .join('');

                break;


            case 'removeLinks':

                text =
                    text.replace(
                        /(?:https?:\/\/|www\.)[^\s]+/gi,
                        ''
                    );

                break;


            case 'removeAIReferences':

                text =
                    text.replace(
                        /\[\[[\s\S]*?\]\]/g,
                        ''
                    );

                break;

        }


        outputArea.value =
            text;


        outputCount.innerText =
            `${text.length} อักษร`;


        saveState(text);

    }


    /* ========================================================= */
    /* File Save System */
    /* ========================================================= */


    const FILE_TYPES = {

        txt: {
            mime: 'text/plain',
            description: 'Text File',
            extension: '.txt'
        },

        md: {
            mime: 'text/markdown',
            description: 'Markdown File',
            extension: '.md'
        },

        csv: {
            mime: 'text/csv',
            description: 'CSV File',
            extension: '.csv'
        },

        html: {
            mime: 'text/html',
            description: 'HTML File',
            extension: '.html'
        },

        json: {
            mime: 'application/json',
            description: 'JSON File',
            extension: '.json'
        },

        xml: {
            mime: 'application/xml',
            description: 'XML File',
            extension: '.xml'
        },

        pdf: {
            mime: 'application/pdf',
            description: 'PDF File',
            extension: '.pdf'
        }

    };


    /* ========================================================= */
    /* Clean filename */
    /* ========================================================= */

    function sanitizeFileName(name) {

        return name
            .trim()
            .replace(
                /[<>:"/\\|?*\u0000-\u001F]/g,
                '_'
            )
            .replace(
                /\s+/g,
                ' '
            )
            .replace(
                /\.+$/,
                ''
            );

    }


    /* ========================================================= */
    /* Ensure Extension */
    /* ========================================================= */

    function ensureExtension(
        name,
        format
    ) {

        const extension =
            FILE_TYPES[format].extension;

        if (
            name
                .toLowerCase()
                .endsWith(
                    extension
                )
        ) {

            return name;

        }

        return name + extension;

    }


    /* ========================================================= */
    /* Create document content */
    /* ========================================================= */

    function createTextBlob(
        text,
        format,
        defaultName
    ) {


        if (format === 'txt') {

            return new Blob(
                [text],
                {
                    type:
                        'text/plain;charset=utf-8'
                }
            );

        }


        if (format === 'md') {

            return new Blob(
                [text],
                {
                    type:
                        'text/markdown;charset=utf-8'
                }
            );

        }


        if (format === 'csv') {

            return new Blob(
                ['\uFEFF' + text],
                {
                    type:
                        'text/csv;charset=utf-8'
                }
            );

        }


        if (format === 'html') {

            const htmlContent =
`<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(defaultName)}</title>
<style>
body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    padding: 30px;
    white-space: pre-wrap;
    word-wrap: break-word;
}
</style>
</head>
<body>${escapeHtml(text)}</body>
</html>`;


            return new Blob(
                [htmlContent],
                {
                    type:
                        'text/html;charset=utf-8'
                }
            );

        }


        if (format === 'json') {

            const jsonContent =
                JSON.stringify(
                    {
                        source: 'TheMuiZ',
                        title: defaultName,
                        content: text
                    },
                    null,
                    2
                );


            return new Blob(
                [jsonContent],
                {
                    type:
                        'application/json;charset=utf-8'
                }
            );

        }


        if (format === 'xml') {

            const safeText =
                text
                    .replace(
                        /\]\]>/g,
                        ']]]]><![CDATA[>'
                    );


            const xmlContent =
`<?xml version="1.0" encoding="UTF-8"?>
<document>
    <source>TheMuiZ</source>
    <title>${escapeXml(defaultName)}</title>
    <content><![CDATA[
${safeText}
    ]]></content>
</document>`;


            return new Blob(
                [xmlContent],
                {
                    type:
                        'application/xml;charset=utf-8'
                }
            );

        }


        return null;

    }


    /* ========================================================= */
    /* Create PDF Blob */
    /* ========================================================= */

    function createPDFBlob(text) {

        if (
            !window.jspdf ||
            !window.jspdf.jsPDF
        ) {

            throw new Error(
                'ไม่พบระบบสร้าง PDF'
            );

        }


        const {
            jsPDF
        } = window.jspdf;


        const doc =
            new jsPDF();


        const pageWidth =
            doc.internal.pageSize.getWidth();


        const pageHeight =
            doc.internal.pageSize.getHeight();


        const margin = 15;


        const maxWidth =
            pageWidth -
            (margin * 2);


        doc.setFont(
            'helvetica',
            'normal'
        );


        doc.setFontSize(12);


        const lines =
            doc.splitTextToSize(
                text,
                maxWidth
            );


        let y = 20;

        const lineHeight = 7;


        lines.forEach(
            line => {

                if (
                    y >
                    pageHeight - 20
                ) {

                    doc.addPage();

                    y = 20;

                }


                doc.text(
                    line,
                    margin,
                    y
                );


                y += lineHeight;

            }
        );


        return doc.output(
            'blob'
        );

    }


    /* ========================================================= */
    /* Generate final Blob */
    /* ========================================================= */

    function createDocumentBlob(
        text,
        format,
        defaultName
    ) {

        if (
            format === 'pdf'
        ) {

            return createPDFBlob(
                text
            );

        }


        return createTextBlob(
            text,
            format,
            defaultName
        );

    }


    /* ========================================================= */
    /* Native Save Picker */
    /* ========================================================= */

    async function saveWithNativePicker(
        blob,
        fileName,
        format
    ) {

        if (
            typeof window.showSaveFilePicker !==
            'function'
        ) {

            return false;

        }


        const type =
            FILE_TYPES[format];


        try {

            /*
             * IMPORTANT:
             *
             * showSaveFilePicker()
             * ต้องถูกเรียกจากการกดปุ่ม
             * โดยตรงเพื่อรักษา user activation
             */

            const fileHandle =
                await window.showSaveFilePicker({

                    suggestedName:
                        fileName,

                    startIn:
                        'downloads',

                    types: [

                        {

                            description:
                                type.description,

                            accept: {

                                [type.mime]:
                                    [type.extension]

                            }

                        }

                    ]

                });


            const writable =
                await fileHandle.createWritable();


            await writable.write(
                blob
            );


            await writable.close();


            return true;


        } catch (error) {

            /*
             * ผู้ใช้กดยกเลิก
             */

            if (
                error &&
                error.name === 'AbortError'
            ) {

                return true;

            }


            console.error(
                'Native Save Picker Error:',
                error
            );


            return false;

        }

    }


    /* ========================================================= */
    /* Fallback Save */
    /* ========================================================= */

    async function saveWithFallback(
        blob,
        defaultFileName
    ) {

        /*
         * ถ้า WebView ไม่รองรับ
         * showSaveFilePicker()
         * ให้ถามชื่อไฟล์ก่อน
         */

        let requestedName =
            window.prompt(
                'กรอกชื่อไฟล์ที่ต้องการบันทึก',
                defaultFileName
            );


        if (
            requestedName === null
        ) {

            return false;

        }


        requestedName =
            sanitizeFileName(
                requestedName
            );


        if (
            !requestedName
        ) {

            requestedName =
                defaultFileName;

        }


        const finalName =
            requestedName;


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement('a');


        link.href =
            url;


        link.download =
            finalName;


        link.style.display =
            'none';


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        return true;

    }


    /* ========================================================= */
    /* MAIN SAVE FUNCTION */
    /* ========================================================= */

    async function saveDocument() {

        const text =
            outputArea.value;


        const format =
            document.getElementById(
                'document-format'
            ).value;


        if (
            !text.trim()
        ) {

            alert(
                'ไม่มีข้อความในช่องแสดงผลลัพธ์สำหรับบันทึก'
            );

            return;

        }


        const defaultBaseName =
            'TheMuiZ_Document';


        const defaultFileName =
            defaultBaseName +
            FILE_TYPES[format].extension;


        try {

            /*
             * =================================================
             * 1. รองรับ Native File Picker
             * =================================================
             *
             * ใช้ก่อนเสมอ
             */

            if (
                typeof window.showSaveFilePicker ===
                'function'
            ) {

                /*
                 * เปิดหน้าต่าง Save ก่อน
                 * เพื่อไม่ให้ user activation หาย
                 */

                let fileHandle;


                try {

                    const type =
                        FILE_TYPES[format];


                    fileHandle =
                        await window.showSaveFilePicker({

                            suggestedName:
                                defaultFileName,

                            startIn:
                                'downloads',

                            types: [

                                {

                                    description:
                                        type.description,

                                    accept: {

                                        [type.mime]:
                                            [type.extension]

                                    }

                                }

                            ]

                        });

                } catch (error) {

                    /*
                     * ผู้ใช้กดยกเลิก
                     */

                    if (
                        error &&
                        error.name === 'AbortError'
                    ) {

                        return;

                    }


                    throw error;

                }


                /*
                 * สร้างไฟล์หลังจากได้
                 * fileHandle แล้ว
                 */

                const blob =
                    createDocumentBlob(
                        text,
                        format,
                        defaultBaseName
                    );


                const writable =
                    await fileHandle.createWritable();


                await writable.write(
                    blob
                );


                await writable.close();


                showSaveToast(
                    'บันทึกไฟล์สำเร็จ!'
                );


                return;

            }


            /*
             * =================================================
             * 2. Fallback สำหรับ WebView เก่า
             * =================================================
             */

            let blob =
                createDocumentBlob(
                    text,
                    format,
                    defaultBaseName
                );


            await saveWithFallback(
                blob,
                defaultFileName
            );


            showSaveToast(
                'ส่งไฟล์ไปยังระบบดาวน์โหลดแล้ว'
            );


        } catch (error) {

            console.error(
                'Save Error:',
                error
            );


            alert(
                'ไม่สามารถบันทึกไฟล์ได้\n\n' +
                'รายละเอียด: ' +
                (
                    error.message ||
                    error
                )
            );

        }

    }


    /* ========================================================= */
    /* XML escape */
    /* ========================================================= */

    function escapeXml(text) {

        return text
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&apos;'
            );

    }


    /* ========================================================= */
    /* HTML escape */
    /* ========================================================= */

    function escapeHtml(text) {

        return text
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&#039;'
            );

    }


    /* ========================================================= */
    /* Toast */
    /* ========================================================= */

    function showSaveToast(
        message = 'บันทึกไฟล์สำเร็จ!'
    ) {

        toast.innerText =
            message;

        toast.className =
            'show';


        setTimeout(
            () => {

                toast.className =
                    '';

            },
            2500
        );

    }


    /* ========================================================= */
    /* ตรวจสอบระบบบันทึก */
    /* ========================================================= */

    function checkFileSaveSupport() {

        const supported =
            typeof window.showSaveFilePicker ===
            'function';


        console.log(
            'TheMuiZ File Save API:',
            supported
                ? 'Native Save Picker รองรับ'
                : 'ใช้ระบบ Fallback'
        );

    }


    checkFileSaveSupport();

</script>
