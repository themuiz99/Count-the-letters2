<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เครื่องมือนับตัวอักษรและจัดการข้อความ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght=300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
        }
        /* ป้องกันการเลื่อนหน้าจอระบบหลัก */
        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col justify-between p-3 selection:bg-emerald-500 selection:text-slate-950">

    <!-- ส่วนหัวหน้าเว็บ (Header) ขนาดมินิมอลสุดๆ -->
    <header class="flex flex-row justify-between items-center pb-2 border-b border-slate-900/80">
        <div class="flex items-center gap-1.5">
            <span class="text-base">✍️</span>
            <div>
                <h1 class="text-xs font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-300">
                    เครื่องมือนับตัวอักษรและจัดการข้อความ
                </h1>
                <p class="text-[9px] text-slate-500">นับอักษรและจัดการข้อความด่วน</p>
            </div>
        </div>
        <span class="text-[8px] bg-slate-900 text-slate-400 px-1.5 py-0.5 rounded border border-slate-800 font-medium">
            v1.4
        </span>
    </header>

    <!-- ส่วนเนื้อหาหลัก จัดวางให้พอดีหน้าจอโดยใช้ Flexbox -->
    <main class="flex-grow flex flex-col gap-2.5 my-2 min-h-0">
        
        <!-- แผงแสดงสถิติการตรวจนับ (ย่อขนาดและกระชับพื้นที่) -->
        <section class="grid grid-cols-2 gap-2">
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-900 flex flex-col justify-center">
                <span class="text-[10px] text-slate-400 font-bold">รวมสเปซ</span>
                <div class="flex items-baseline gap-1">
                    <span id="charCount" class="text-lg font-black text-emerald-400">0</span>
                    <span class="text-[9px] text-slate-500">ตัว</span>
                </div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-900 flex flex-col justify-center">
                <span class="text-[10px] text-slate-400 font-bold">ไม่รวมสเปซ</span>
                <div class="flex items-baseline gap-1">
                    <span id="charNoSpaceCount" class="text-lg font-black text-emerald-400">0</span>
                    <span class="text-[9px] text-slate-500">ตัว</span>
                </div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-900 flex flex-col justify-center">
                <span class="text-[10px] text-slate-400 font-bold">จำนวนคำ</span>
                <div class="flex items-baseline gap-1">
                    <span id="wordCount" class="text-lg font-black text-emerald-400">0</span>
                    <span class="text-[9px] text-slate-500">คำ</span>
                </div>
            </div>
            <div class="bg-slate-900/60 p-2 rounded-xl border border-slate-900 flex flex-col justify-center">
                <span class="text-[10px] text-slate-400 font-bold">จำนวนบรรทัด</span>
                <div class="flex items-baseline gap-1">
                    <span id="lineCount" class="text-lg font-black text-emerald-400">0</span>
                    <span class="text-[9px] text-slate-500">แถว</span>
                </div>
            </div>
        </section>

        <!-- พื้นที่ป้อนข้อความ (ยืดหยุ่นตามพื้นที่ว่างที่เหลือ) -->
        <section class="flex-grow flex flex-col gap-1 min-h-0">
            <div class="flex justify-between items-center px-1">
                <label for="editor" class="text-[10px] font-bold text-slate-400 flex items-center gap-1">
                    <span class="inline-block w-1 h-1 rounded-full bg-emerald-500 animate-pulse"></span>
                    กรอกหรือวางข้อความของตะเองที่นี่เลยจ้า
                </label>
                <span id="saveStatus" class="text-[9px] text-slate-500 transition-opacity duration-300 opacity-0">เซฟชั่วคราวแล้ว</span>
            </div>
            <div class="relative flex-grow min-h-0">
                <textarea 
                    id="editor" 
                    class="w-full h-full bg-slate-900 border border-slate-850 focus:border-emerald-500 rounded-xl p-3 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:ring-0 transition-colors resize-none leading-relaxed text-sm"
                    placeholder="พิมพ์หรือวางข้อความตรงนี้..."
                ></textarea>
                <!-- ปุ่มควบคุมการย้อนกลับและเคลียร์ข้อความแบบเล็กกะทัดรัด -->
                <div class="absolute bottom-2 right-2 flex gap-1.5">
                    <button 
                        onclick="undo()" 
                        class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded-lg text-[9px] font-bold border border-slate-700/60 transition-colors flex items-center gap-1 backdrop-blur active:scale-95"
                    >
                        ↩️ ย้อนกลับ
                    </button>
                    <button 
                        onclick="clearText()" 
                        class="bg-red-950/80 hover:bg-red-900 text-red-200 px-2 py-1 rounded-lg text-[9px] font-bold border border-red-800/40 transition-colors flex items-center gap-1 backdrop-blur active:scale-95"
                    >
                        🗑️ ล้างทั้งหมด
                    </button>
                </div>
            </div>
        </section>

        <!-- แผงเครื่องมือควบคุมการทำงาน -->
        <section class="bg-slate-900/40 border border-slate-900 rounded-xl p-2.5 flex flex-col gap-2">
            
            <!-- เครื่องมือลบสิ่งที่กำหนดเฉพาะเจาะจง -->
            <div class="flex flex-col gap-1 border-b border-slate-900/60 pb-2">
                <label for="specificDeleteInput" class="text-[9px] font-bold text-slate-400">
                    ❌ สิ่งที่ต้องการลบออก (คั่นด้วย , เช่น #,฿,®)
                </label>
                <div class="flex gap-1.5">
                    <input 
                        type="text" 
                        id="specificDeleteInput" 
                        placeholder="พิมพ์สิ่งที่ต้องการลบ..." 
                        class="flex-grow bg-slate-950 border border-slate-850 focus:border-emerald-500 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 placeholder:text-slate-700 focus:outline-none focus:ring-0 transition-all"
                    />
                    <button 
                        onclick="removeSpecific()" 
                        class="bg-red-650 hover:bg-red-600 text-red-100 px-3 py-1.5 rounded-lg text-[10px] font-bold border border-red-800/50 transition-colors flex items-center gap-1 shrink-0 active:scale-95"
                    >
                        ลบเฉพาะที่กรอก
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-1.5">
                <button onclick="removeSymbols()" class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95">
                    <span class="text-sm">✨</span>
                    <span class="text-[10px] font-bold">ลบสัญลักษณ์</span>
                </button>
                <button onclick="removeNumbers()" class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95">
                    <span class="text-sm">🚫</span>
                    <span class="text-[10px] font-bold">ลบตัวเลข</span>
                </button>
                <button onclick="removeVowels()" class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95">
                    <span class="text-sm">🧪</span>
                    <span class="text-[10px] font-bold">ลบสระ/วรรณ</span>
                </button>
                <button onclick="squeezeSpaces()" class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95">
                    <span class="text-sm">↔️</span>
                    <span class="text-[10px] font-bold">จัดช่องว่าง</span>
                </button>
                <button onclick="convertUpper()" class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95">
                    <span class="text-sm">🅰️</span>
                    <span class="text-[10px] font-bold">พิมพ์ใหญ่</span>
                </button>
                <button onclick="convertLower()" class="bg-slate-900 hover:bg-slate-850 text-slate-200 py-2 px-1 rounded-lg border border-slate-800 text-center transition-all hover:border-emerald-500/30 flex flex-col items-center justify-center gap-1 active:scale-95">
                    <span class="text-sm">ⓐ</span>
                    <span class="text-[10px] font-bold">พิมพ์เล็ก</span>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-900/60">
                <button onclick="shuffleWords()" class="bg-amber-950/20 hover:bg-amber-950/40 text-amber-200 py-2.5 px-2 rounded-lg border border-amber-900/30 text-[10px] font-bold transition-all flex items-center justify-center gap-1 active:scale-95">
                    🌪️ สุ่มสลับคำ
                </button>
                <button onclick="copyToClipboard()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-2.5 px-2 rounded-lg text-[10px] font-black transition-all flex items-center justify-center gap-1.5 shadow-lg shadow-emerald-500/5 active:scale-95">
                    📋 ก๊อปปี้ไปใช้โลด
                </button>
            </div>
        </section>

        <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 border-2 border-emerald-500 text-emerald-400 px-4 py-2 rounded-full shadow-2xl shadow-emerald-500/10 flex items-center gap-1.5 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 z-50">
            <span class="text-sm">🎉</span>
            <span id="toastMessage" class="text-[10px] font-bold">คัดลอกเรียบร้อยแล้วจ้า</span>
        </div>
    </main>

    <footer class="border-t border-slate-900 py-1.5 text-center text-[8px] text-slate-600 flex flex-col gap-0.5">
        <p class="font-bold text-slate-500">
            สงวนลิขสิทธิ์ตาม พรบ.ลิขสิทธิ์ © 2026 โดย 
            <span class="text-emerald-400 font-extrabold hover:text-teal-300 transition-colors">พี่มุ่ยสุดหล่อ</span> 
        </p>
    </footer>

    <script>
        const editor = document.getElementById('editor');
        const charCount = document.getElementById('charCount');
        const charNoSpaceCount = document.getElementById('charNoSpaceCount');
        const wordCount = document.getElementById('wordCount');
        const lineCount = document.getElementById('lineCount');
        const saveStatus = document.getElementById('saveStatus');
        const specificDeleteInput = document.getElementById('specificDeleteInput');

        let history = [];
        let lastValue = '';

        function saveState() {
            const currentText = editor.value;
            if (history.length === 0 || history[history.length - 1] !== currentText) {
                history.push(currentText);
                if (history.length > 50) history.shift();
            }
            lastValue = currentText;
        }

        function undo() {
            if (history.length > 0) {
                const previousState = history.pop();
                editor.value = previousState;
                lastValue = previousState;
                updateMetrics();
                showToast('ย้อนกลับการทำงานแล้วจ้า');
            } else {
                showToast('ไม่มีขั้นตอนให้ย้อนกลับแล้วจ้า');
            }
        }

        function updateMetrics() {
            const text = editor.value;
            charCount.textContent = text.length;
            const textNoSpace = text.replace(/\s/g, '');
            charNoSpaceCount.textContent = textNoSpace.length;
            const trimmedText = text.trim();
            wordCount.textContent = trimmedText === '' ? 0 : trimmedText.split(/\s+/).length;
            lineCount.textContent = text === '' ? 0 : text.split('\n').length;
            localStorage.setItem('github_char_counter_saved_text', text);
            showSaveIndicator();
        }

        window.onload = function() {
            const savedText = localStorage.getItem('github_char_counter_saved_text');
            if (savedText) {
                editor.value = savedText;
                lastValue = savedText;
                updateMetrics();
            }
        };

        let typingTimer;
        editor.addEventListener('input', () => {
            updateMetrics();
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                if (lastValue !== editor.value) {
                    if (history.length === 0 || history[history.length - 1] !== lastValue) {
                        history.push(lastValue);
                        if (history.length > 50) history.shift();
                    }
                    lastValue = editor.value;
                }
            }, 800);
        });

        function showSaveIndicator() {
            saveStatus.classList.remove('opacity-0');
            saveStatus.classList.add('opacity-100');
            setTimeout(() => { saveStatus.classList.replace('opacity-100', 'opacity-0'); }, 1000);
        }

        function removeSpecific() {
            const originalText = editor.value;
            const queryValue = specificDeleteInput.value;
            if (!originalText || !queryValue) return;
            saveState();
            const targets = queryValue.split(',');
            let cleanedText = originalText;
            targets.forEach(target => {
                const escapedTarget = target.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                if (escapedTarget !== '') cleanedText = cleanedText.replace(new RegExp(escapedTarget, 'g'), '');
            });
            editor.value = cleanedText;
            updateMetrics();
            showToast('ลบเรียบร้อยจ้า');
        }

        function removeSymbols() { saveState(); editor.value = editor.value.replace(/[^\u0E01-\u0E5B a-zA-Z0-9\s]/g, ''); updateMetrics(); showToast('ลบสัญลักษณ์เรียบร้อยจ้า'); }
        function removeNumbers() { saveState(); editor.value = editor.value.replace(/[0-9๐-๙]/g, ''); updateMetrics(); showToast('ลบตัวเลขเรียบร้อยจ้า'); }
        function removeVowels() { saveState(); editor.value = editor.value.replace(/[\u0E30-\u0E3F\u0E47-\u0E4E]/g, ''); updateMetrics(); showToast('ลบสระเรียบร้อยจ้า'); }
        function squeezeSpaces() { saveState(); editor.value = editor.value.replace(/[^\S\r\n]+/g, ' ').trim(); updateMetrics(); showToast('จัดช่องว่างเรียบร้อยจ้า'); }
        function convertUpper() { saveState(); editor.value = editor.value.toUpperCase(); updateMetrics(); showToast('พิมพ์ใหญ่เรียบร้อยจ้า'); }
        function convertLower() { saveState(); editor.value = editor.value.toLowerCase(); updateMetrics(); showToast('พิมพ์เล็กเรียบร้อยจ้า'); }
        function shuffleWords() { saveState(); let words = editor.value.trim().split(/\s+/); words.sort(() => Math.random() - 0.5); editor.value = words.join(' '); updateMetrics(); showToast('สลับคำเรียบร้อยจ้า'); }
        function clearText() { saveState(); editor.value = ''; updateMetrics(); showToast('ล้างข้อความเรียบร้อยจ้า'); editor.focus(); }

        function copyToClipboard() {
            const text = editor.value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => showToast('คัดลอกเรียบร้อยจ้า'));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); toast.classList.remove('opacity-100'); }, 2000);
        }
    </script>
</body>
</html>
