<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheMuiz - Text Chunker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            color: var(--accent-color);
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        textarea, input[type="number"] {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea {
            height: 150px;
            resize: vertical;
        }
        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }
        .results {
            margin-top: 20px;
        }
        .chunk-box {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .chunk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .chunk-content {
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 8px;
            max-height: 100px;
            overflow-y: auto;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            width: auto;
            background: #334155;
            color: #f8fafc;
        }
        .btn-small:hover {
            background: var(--accent-color);
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TheMuiz - ตัวตัดแบ่งข้อความสำหรับ TTS</h1>
        <div class="form-group">
            <label for="inputText">ใส่ข้อความที่ต้องการตัดแบ่ง:</label>
            <textarea id="inputText" placeholder="พิมพ์หรือวางข้อความยาวๆ ตรงนี้..."></textarea>
        </div>
        <div class="form-group">
            <label for="charLimit">จำนวนตัวอักษรสูงสุดต่อ 1 ส่วน (Character Limit):</label>
            <input type="number" id="charLimit" value="500" min="50" max="5000">
        </div>
        <div class="form-group">
            <button onclick="splitText()">ตัดแบ่งข้อความ (Split Text)</button>
        </div>
        
        <div class="results" id="resultsContainer"></div>
    </div>

    <script>
        // ฟังก์ชันตรวจสอบว่ารันอยู่ใน Application (แอปพลิเคชัน) หรือ WebView (เว็บวิว) หรือไม่
        function isWebView() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            return /(wv|iP(hone|ad|od).*AppleWebKit(?!.*Safari))/i.test(userAgent) || !/Chrome|Safari/i.test(userAgent);
        }

        // ฟังก์ชันดาวน์โหลดไฟล์แยกตามสภาพแวดล้อม (Browser vs Application)
        function downloadFile(filename, text) {
            if (isWebView()) {
                // รูปแบบสำหรับ Application (แอปพลิเคชัน) / WebView (เว็บวิว): ใช้ Data URL (ดาต้า URL)
                try {
                    const dataUri = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
                    const link = document.createElement('a');
                    link.href = dataUri;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (e) {
                    // ระบบสำรองกรณีแอปบล็อก: ใช้ Clipboard (คลิปบอร์ดสำหรับพักข้อมูล)
                    navigator.clipboard.writeText(text).then(() => {
                        alert('แอปไม่อนุญาตให้ดาวน์โหลดไฟล์โดยตรง มะลิคัดลอกข้อความลง Clipboard (คลิปบอร์ด) ให้เรียบร้อยแล้วค่ะ');
                    });
                }
            } else {
                // รูปแบบสำหรับ Browser (โปรแกรมท่องเว็บ) ปกติ: ใช้ Blob (ข้อมูลจำลองแบบบล็อบ) ตามเดิม
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            }
        }

        function splitText() {
            const text = document.getElementById('inputText').value;
            const limit = parseInt(document.getElementById('charLimit').value) || 500;
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            if (!text.trim()) {
                alert('รบกวนใส่ข้อความก่อนนะคะพี่มุ่ย!');
                return;
            }

            let chunks = [];
            let index = 0;
            
            while (index < text.length) {
                let chunk = text.substr(index, limit);
                chunks.push(chunk);
                index += limit;
            }

            chunks.forEach((chunk, i) => {
                const box = document.createElement('div');
                box.className = 'chunk-box';
                
                const header = document.createElement('div');
                header.className = 'chunk-header';
                header.innerHTML = `<span>ส่วนที่ ${i + 1} (${chunk.length} ตัวอักษร)</span>`;

                const btn = document.createElement('button');
                btn.className = 'btn-small';
                btn.textContent = 'ดาวน์โหลดไฟล์นี้ (Download)';
                btn.onclick = () => {
                    downloadFile(`themuiz_chunk_${i + 1}.txt`, chunk);
                };

                header.appendChild(btn);

                const content = document.createElement('div');
                content.className = 'chunk-content';
                content.textContent = chunk;

                box.appendChild(header);
                box.appendChild(content);
                container.appendChild(box);
            });
        }
    </script>
</body>
</html>
